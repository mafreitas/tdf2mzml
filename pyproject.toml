[project]
name = "tdf2mzml"
version = "0.6.0"
description = "Convert Bruker TimsTOF TDF files to indexed mzML"
authors = [{name = "Michael A. Freitas", email = "mike.freitas@gmail.com"}]
readme = "README.md"
license = {file = "LICENSE.md"}
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
]

[project.urls]
Home = "https://github.com/mafreitas/tdf2mzml"

[project.scripts]
tdf2mzml = "tdf2mzml.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.9",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "numpy>=1.24",
]

# ---------------------------------------------------------------------------
# Build system
# ---------------------------------------------------------------------------

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tdf2mzml = ["libs/*.so", "libs/*.dll", "libs/*.lib"]

# ---------------------------------------------------------------------------
# mypy — strict mode
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

# ctypes-heavy module — relax some checks
[[tool.mypy.overrides]]
module = "tdf2mzml.io.timsdata"
disallow_any_generics = false
warn_return_any = false
disallow_untyped_decorators = false

# ---------------------------------------------------------------------------
# ruff — linting + formatting
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F",   # pyflakes / pycodestyle
    "D",        # pydocstyle (NumPy convention)
    "ANN",      # type annotations
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "RUF",      # ruff-specific rules
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
]
ignore = [
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# XML string builders have unavoidably long lines
"src/tdf2mzml/output/xml_elements.py" = ["E501"]
# Test fixtures don't need return-type annotations
"tests/conftest.py" = ["ANN201"]
# Test methods don't need individual docstrings; magic methods covered by class doc
"tests/*.py" = ["D102", "D105", "ANN201"]

[tool.ruff.lint.isort]
known-first-party = ["tdf2mzml"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (docker, integration — skipped in CI)",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["tdf2mzml"]

[tool.coverage.report]
show_missing = true
# Full-suite coverage target; CI runs without TDF SDK/data so only
# xml_elements, constants, encoding, and models are exercised.
# The integration tests (test_conversion, test_ms1, test_reader) cover
# the IO and processing modules when run locally with test data.
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
]
